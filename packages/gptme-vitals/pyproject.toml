[project]
name = "gptme-vitals"
version = "0.1.0"
description = "Shared agent-dashboard skeleton for gptme agents: typed page envelope, derived fleet core.json, design base"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gptme-vitals = "gptme_vitals.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptme_vitals"]
