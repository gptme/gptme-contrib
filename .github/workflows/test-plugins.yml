name: Test Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # master pushes test only what the push changed; the full matrix runs nightly
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Pushes to a branch share one group without cancel-in-progress: a running
# master run finishes, but a queued one is replaced by the newer push, so a
# burst of merges runs once on the latest commit instead of once per commit.
# Push runs only test what changed, so `discover` diffs from the last run of
# this workflow that actually started, not from github.event.before; the
# survivor then also covers the commits of the replaced runs.
# Schedule/dispatch runs keep a per-commit group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which paths changed to skip expensive jobs on unrelated PRs
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          plugins:
            - 'plugins/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'Makefile'
            - '.github/workflows/test-plugins.yml'

  # Discovery job - outputs plugin matrix dynamically using Makefile (single source of truth)
  # On PRs, filters the matrix to only plugins with actual file changes
  discover:
    needs: changes
    # Always run on push to master; on PRs, only when plugin code changed
    if: github.event_name != 'pull_request' || needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff against base branch on PRs

      - name: Discover plugins with tests
        id: discover
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get all plugins from Makefile (single source of truth)
          make ci-list-plugins-json > /tmp/all_plugins.json

          # A queued push run can be replaced by a newer push (see the
          # concurrency note at the top). Diff from the last run of this workflow
          # on this branch that started (in progress, or completed with success
          # or failure) so the commits of replaced runs are tested too. Keep
          # github.event.before if the lookup fails or finds no ancestor.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            covered=$(gh api "repos/${{ github.repository }}/actions/workflows/test-plugins.yml/runs?branch=${{ github.ref_name }}&event=push&per_page=50" \
              --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }} and (.status == "in_progress" or (.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))))][0].head_sha // empty' \
              2>/dev/null || true)
            if [[ -n "$covered" && "$covered" != "$BEFORE" ]] \
                && git cat-file -e "${covered}^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$covered" HEAD; then
              echo "Diffing from $covered, the last started run of this workflow (event.before: $BEFORE)"
              BEFORE="$covered"
            fi
          fi

          # Files changed by this PR, or by this push to master. Schedule/dispatch
          # runs (and pushes we can't diff, e.g. a new branch or a force-push
          # past the old head) test everything.
          changed=""
          full=1
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            full=0
          elif [[ "${{ github.event_name }}" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            full=0
          fi

          if [[ "$full" == "0" ]]; then

            # If shared config changed, run all plugins (can't tell which are affected)
            if echo "$changed" | grep -qE '^(Makefile|pyproject\.toml|uv\.lock|\.github/workflows/test-plugins\.yml)'; then
              echo "Shared config changed, running all plugins"
              plugins=$(cat /tmp/all_plugins.json)
            else
              # Files directly under plugins/ (not in a subdirectory) also trigger full run
              if echo "$changed" | grep -qE '^plugins/[^/]+$'; then
                echo "Root-level plugins/ file changed, running all plugins"
                plugins=$(cat /tmp/all_plugins.json)
              else
                # Extract affected plugin names from changed paths (plugins/<name>/...)
                affected=$(echo "$changed" | sed -n 's|^plugins/\([^/]*\)/.*|\1|p' | sort -u)

                if [ -z "$affected" ]; then
                  echo "No plugin files changed, skipping tests"
                  plugins="[]"
                else
                  # Filter all plugins to only affected ones
                  plugins=$(echo "$affected" | python3 -c "import json,sys; all_plugins=json.load(open('/tmp/all_plugins.json')); affected=set(sys.stdin.read().strip().split('\n')); print(json.dumps([p for p in all_plugins if p in affected]))")
                fi
              fi
            fi
          else
            plugins=$(cat /tmp/all_plugins.json)
          fi

          echo "plugins=$plugins" >> $GITHUB_OUTPUT
          echo "Discovered plugins: $plugins"

  # Test each plugin in parallel
  test:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e "plugins/${{ matrix.plugin }}[test]"

      - name: Run unit tests for ${{ matrix.plugin }}
        run: |
          pytest plugins/${{ matrix.plugin }}/tests -v -m "not slow" --timeout=30

  # Integration tests (only on master push, with API keys)
  integration-tests:
    needs: discover
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.discover.result == 'success' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -e plugins/${{ matrix.plugin }}

      - name: Run integration tests for ${{ matrix.plugin }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -d "plugins/${{ matrix.plugin }}/tests/integration" ]; then
            pytest plugins/${{ matrix.plugin }}/tests/integration -v --timeout=120
          else
            echo "No integration tests found for ${{ matrix.plugin }}"
          fi

  # Coverage report (combined for all plugins)
  coverage:
    needs: changes
    # Always run on push to master; on PRs, only when plugin code changed
    if: github.event_name != 'pull_request' || needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          # Install all plugins
          for plugin in plugins/*/; do
            if [ -f "$plugin/pyproject.toml" ]; then
              pip install -e "$plugin"
            fi
          done

      - name: Run coverage
        run: |
          # Find all plugins with tests and collect coverage
          # All plugins in this repo use src/ layout; the check is belt-and-suspenders
          for plugin_dir in plugins/*/; do
            plugin="${plugin_dir%/}"  # strip trailing slash to avoid double-slash paths
            if [ -d "$plugin/tests" ] && [ -d "$plugin/src" ]; then
              pytest "$plugin/tests" -v -m "not slow" --cov="$plugin/src" --cov-append --cov-report=term-missing --timeout=30 || true
            fi
          done
          # Generate combined XML report once after all plugins
          coverage xml || true

      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: plugins
          name: codecov-plugins
          fail_ci_if_error: false
