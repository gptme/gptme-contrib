name: Test Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, 'feat/**' ]
  # Merge queue: test the queued merge commit before it lands on master.
  merge_group:
    types: [checks_requested]
  # master pushes test only what the push changed; the full matrix runs nightly
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Pushes to a branch share one group without cancel-in-progress: a running
# master run finishes, but a queued one is replaced by the newer push, so a
# burst of merges runs once on the latest commit instead of once per commit.
# Push runs only test what changed, so `discover` diffs from a successful run
# of this workflow, not from github.event.before; the survivor then also
# covers replaced or failed runs. Without a safe baseline, test everything.
# Schedule/dispatch runs keep a per-commit group, and so do merge queue runs:
# github.sha is the merge group's head_sha, so a queue run never shares a
# group with (or is cancelled by) a PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which paths changed to skip expensive jobs on unrelated PRs
  changes:
    name: Plugins / detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        # merge_group has no pull_request payload: compare the queued merge
        # commit with the base it was built on (both SHAs, so paths-filter
        # does a plain `git diff base..head`). Empty on other events, which
        # keeps the default PR (API) and push (event.before) behaviour.
        base: ${{ github.event.merge_group.base_sha }}
        ref: ${{ github.event.merge_group.head_sha }}
        filters: |
          plugins:
            - 'plugins/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'Makefile'
            - '.github/workflows/test-plugins.yml'

  # Discovery job - outputs plugin matrix dynamically using Makefile (single source of truth)
  # On PRs, filters the matrix to only plugins with actual file changes
  discover:
    needs: changes
    # Always run on push to master; on PRs and in the merge queue, only when
    # plugin code changed
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff against the base on PRs and merge groups

      - name: Discover plugins with tests
        id: discover
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get all plugins from Makefile (single source of truth)
          make ci-list-plugins-json > /tmp/all_plugins.json

          # Only success establishes coverage: a failed or in-progress run may
          # never reach its test matrix. Filter server-side so queued/cancelled
          # bursts cannot crowd the baseline out of the response. If the lookup
          # fails, is empty, or finds a non-ancestor, clear BEFORE to run fully;
          # event.before alone would omit changes from replaced runs.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE=""
            covered=$(gh api "repos/${{ github.repository }}/actions/workflows/test-plugins.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }} and .status == "completed" and .conclusion == "success")][0].head_sha // empty' \
              2>/dev/null || true)
            if [[ -n "$covered" ]] \
                && git cat-file -e "${covered}^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$covered" HEAD; then
              echo "Diffing from $covered, the last successful run of this workflow"
              BEFORE="$covered"
            else
              echo "No successful ancestor baseline; running all plugins"
            fi
          fi

          # Files changed by this PR, by this merge queue group (queued merge
          # commit vs the base it was built on), or by this push to master.
          # Schedule/dispatch runs (and pushes or groups we can't diff, e.g. a
          # new branch or a force-push past the old head) test everything.
          changed=""
          full=1
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            full=0
          elif [[ "${{ github.event_name }}" == "merge_group" && -n "$MERGE_GROUP_BASE" ]] \
              && git cat-file -e "${MERGE_GROUP_BASE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$MERGE_GROUP_BASE" HEAD)
            full=0
          elif [[ "${{ github.event_name }}" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            full=0
          fi

          if [[ "$full" == "0" ]]; then

            # If shared config changed, run all plugins (can't tell which are affected)
            if echo "$changed" | grep -qE '^(Makefile|pyproject\.toml|uv\.lock|\.github/workflows/test-plugins\.yml)'; then
              echo "Shared config changed, running all plugins"
              plugins=$(cat /tmp/all_plugins.json)
            else
              # Files directly under plugins/ (not in a subdirectory) also trigger full run
              if echo "$changed" | grep -qE '^plugins/[^/]+$'; then
                echo "Root-level plugins/ file changed, running all plugins"
                plugins=$(cat /tmp/all_plugins.json)
              else
                # Extract affected plugin names from changed paths (plugins/<name>/...)
                affected=$(echo "$changed" | sed -n 's|^plugins/\([^/]*\)/.*|\1|p' | sort -u)

                if [ -z "$affected" ]; then
                  echo "No plugin files changed, skipping tests"
                  plugins="[]"
                else
                  # Filter all plugins to only affected ones
                  plugins=$(echo "$affected" | python3 -c "import json,sys; all_plugins=json.load(open('/tmp/all_plugins.json')); affected=set(sys.stdin.read().strip().split('\n')); print(json.dumps([p for p in all_plugins if p in affected]))")
                fi
              fi
            fi
          else
            plugins=$(cat /tmp/all_plugins.json)
          fi

          echo "plugins=$plugins" >> $GITHUB_OUTPUT
          echo "Discovered plugins: $plugins"

      # Bundle the plugins into a few shards for the test matrix, as
      # test-packages.yml does: a plugin's install + tests take ~0.5 min,
      # while each job pays its own runner provisioning, checkout and Python
      # setup and holds one of the org's 20 shared concurrent job slots.
      # Shards: min(5, ceil(n/8)); round-robin over the sorted list so a
      # plugin keeps its shard between runs. Timeout: ~1.5 min per plugin
      # plus setup, capped at 25.
      - name: Shard plugins
        id: shard
        env:
          ITEMS: ${{ steps.discover.outputs.plugins }}
        run: |
          python3 - <<'PY'
          import json, math, os
          items = sorted(json.loads(os.environ["ITEMS"]))
          count = min(5, math.ceil(len(items) / 8))
          shards = []
          for i in range(count):
              members = items[i::count]
              shards.append({
                  "id": i + 1,
                  "of": count,
                  "plugins": " ".join(members),
                  "timeout": min(25, 10 + math.ceil(1.5 * len(members))),
              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"shards={json.dumps(shards)}\n")
          for shard in shards:
              print(f"shard {shard['id']}/{shard['of']}: {shard['plugins']}")
          PY


  # Test the plugins in a few shards (see "Shard plugins" in discover)
  test:
    name: test (${{ matrix.python-version }}, shard ${{ matrix.shard.id }}/${{ matrix.shard.of }})
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # PRs test the 3.10 floor only, where newer-syntax breaks show up.
        # Merge queue, push, schedule and dispatch keep both ends of the range.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10"]') || fromJSON('["3.10", "3.13"]') }}
        shard: ${{ fromJson(needs.discover.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests for each plugin in the shard
        env:
          SHARD_PLUGINS: ${{ matrix.shard.plugins }}
        run: |
          # Each plugin gets a fresh venv, so it is installed and tested in
          # isolation as in the old one-job-per-plugin matrix (a plugin must
          # not pass on another plugin's dependencies). Every plugin runs even
          # after a failure; the step fails at the end and names the failed
          # plugins.
          test_plugin() {
            # Activate by hand (what bin/activate does) after creating the
            # venv: the PATH change also resets bash's command hash, so
            # python3, pip, pytest and anything the tests spawn use the venv.
            python3 -m venv "$RUNNER_TEMP/venv-$1" &&
              export VIRTUAL_ENV="$RUNNER_TEMP/venv-$1" PATH="$RUNNER_TEMP/venv-$1/bin:$PATH" &&
              python3 -m pip install --upgrade pip &&
              pip install pytest pytest-cov pytest-timeout &&
              pip install -e "plugins/$1[test]" &&
              pytest "plugins/$1/tests" -v -m "not slow" --timeout=30
          }
          failed=()
          summary=()
          for plugin in $SHARD_PLUGINS; do
            echo "::group::$plugin"
            start=$SECONDS
            # Subshell: the venv activation must not leak into the next plugin.
            if (test_plugin "$plugin"); then
              result=pass
            else
              result=FAIL
              failed+=("$plugin")
            fi
            echo "::endgroup::"
            summary+=("$(printf '%-32s %-4s %4ss' "$plugin" "$result" "$((SECONDS - start))")")
          done
          echo "Shard summary:"
          printf '  %s\n' "${summary[@]}"
          {
            echo '```'
            printf '%s\n' "${summary[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Plugin tests failed: ${failed[*]}"
            exit 1
          fi

  # Integration tests (only on master push, with API keys). One job: few
  # plugins have tests/integration, and the old one-job-per-plugin matrix
  # spent a runner on every discovered plugin just to print "No integration
  # tests found". Plugins without tests/integration are skipped before
  # install; the rest get a fresh venv each, as before.
  integration-tests:
    needs: discover
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.discover.result == 'success' && needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run integration tests for each plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PLUGINS: ${{ needs.discover.outputs.plugins }}
        run: |
          integration_test_plugin() {
            # Activate by hand (what bin/activate does) after creating the
            # venv: the PATH change also resets bash's command hash, so
            # python3, pip, pytest and anything the tests spawn use the venv.
            python3 -m venv "$RUNNER_TEMP/venv-$1" &&
              export VIRTUAL_ENV="$RUNNER_TEMP/venv-$1" PATH="$RUNNER_TEMP/venv-$1/bin:$PATH" &&
              python3 -m pip install --upgrade pip &&
              pip install pytest pytest-timeout &&
              pip install -e "plugins/$1" &&
              pytest "plugins/$1/tests/integration" -v --timeout=120
          }
          failed=()
          for plugin in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["PLUGINS"])))'); do
            if [ ! -d "plugins/$plugin/tests/integration" ]; then
              echo "No integration tests found for $plugin"
              continue
            fi
            echo "::group::$plugin"
            if ! (integration_test_plugin "$plugin"); then
              failed+=("$plugin")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Plugin integration tests failed: ${failed[*]}"
            exit 1
          fi

  # Coverage report (combined for all plugins)
  coverage:
    needs: changes
    # Always run on push to master; on PRs, only when plugin code changed.
    # Skipped in the merge queue: it gates nothing (every run ends in
    # `|| true`), and a Codecov upload for a temporary queue branch is noise.
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || needs.changes.outputs.plugins == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          # Install all plugins
          for plugin in plugins/*/; do
            if [ -f "$plugin/pyproject.toml" ]; then
              pip install -e "$plugin"
            fi
          done

      - name: Run coverage
        run: |
          # Find all plugins with tests and collect coverage
          # All plugins in this repo use src/ layout; the check is belt-and-suspenders
          for plugin_dir in plugins/*/; do
            plugin="${plugin_dir%/}"  # strip trailing slash to avoid double-slash paths
            if [ -d "$plugin/tests" ] && [ -d "$plugin/src" ]; then
              pytest "$plugin/tests" -v -m "not slow" --cov="$plugin/src" --cov-append --cov-report=term-missing --timeout=30 || true
            fi
          done
          # Generate combined XML report once after all plugins
          coverage xml || true

      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: plugins
          name: codecov-plugins
          fail_ci_if_error: false

  # Stable required check for the merge queue / branch ruleset. Matrix job
  # names vary per PR, so they can't be required directly. Skipped jobs pass
  # (a PR touching no plugins must be mergeable); failed or cancelled ones
  # fail. always(), not !cancelled(): a skipped required check counts as
  # passing, so this job must run (and fail) even when the run is cancelled.
  # coverage (metric-only) and integration-tests (master push only) are left
  # out on purpose.
  required:
    name: Plugins / required
    needs: [changes, discover, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check needed jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Needed job results: $RESULTS"
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::A required Test Plugins job failed or was cancelled"
            exit 1
          fi
