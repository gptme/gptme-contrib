name: Test Packages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, 'feat/**' ]
  # Merge queue: test the queued merge commit before it lands on master.
  merge_group:
    types: [checks_requested]
  # master pushes test only what the push changed; the full matrix runs nightly
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Pushes to a branch share one group without cancel-in-progress: a running
# master run finishes, but a queued one is replaced by the newer push, so a
# burst of merges runs once on the latest commit instead of once per commit.
# Push runs only test what changed, so `discover` diffs from a successful run
# of this workflow, not from github.event.before; the survivor then also
# covers replaced or failed runs. Without a safe baseline, test everything.
# Schedule/dispatch runs keep a per-commit group, and so do merge queue runs:
# github.sha is the merge group's head_sha, so a queue run never shares a
# group with (or is cancelled by) a PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which paths changed to skip expensive jobs on unrelated PRs
  changes:
    name: Packages / detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      rag: ${{ steps.filter.outputs.rag }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        # merge_group has no pull_request payload: compare the queued merge
        # commit with the base it was built on (both SHAs, so paths-filter
        # does a plain `git diff base..head`). Empty on other events, which
        # keeps the default PR (API) and push (event.before) behaviour.
        base: ${{ github.event.merge_group.base_sha }}
        ref: ${{ github.event.merge_group.head_sha }}
        filters: |
          packages:
            - 'packages/**'
            - 'scripts/**'
            - 'tests/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'Makefile'
            - 'conftest.py'
            - '.github/workflows/test-packages.yml'
          rag:
            - 'packages/gptme-rag/**'
            - 'scripts/claude-code-hooks/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - '.github/workflows/test-packages.yml'

  # Discovery job - outputs package matrix dynamically using Makefile (single source of truth)
  # On PRs, filters the matrix to only packages with actual file changes
  discover:
    needs: changes
    # Always run on push to master; on PRs and in the merge queue, only when
    # package code changed
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff against the base on PRs and merge groups

      - name: Discover packages
        id: discover
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get all packages from Makefile (single source of truth)
          make --no-print-directory ci-list-packages-json > /tmp/all_packages_raw.txt
          # make can emit directory chatter; the JSON array is the line starting with '['
          grep -E '^\[' /tmp/all_packages_raw.txt | tail -1 > /tmp/all_packages.json

          # Surface packages excluded from the matrix, so a coverage loss is
          # visible in the log instead of silently disappearing.
          echo "Packages excluded from the CI matrix:"
          make --no-print-directory ci-list-excluded-packages

          # Only success establishes coverage: a failed or in-progress run may
          # never reach its test matrix. Filter server-side so queued/cancelled
          # bursts cannot crowd the baseline out of the response. If the lookup
          # fails, is empty, or finds a non-ancestor, clear BEFORE to run fully;
          # event.before alone would omit changes from replaced runs.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE=""
            covered=$(gh api "repos/${{ github.repository }}/actions/workflows/test-packages.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }} and .status == "completed" and .conclusion == "success")][0].head_sha // empty' \
              2>/dev/null || true)
            if [[ -n "$covered" ]] \
                && git cat-file -e "${covered}^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$covered" HEAD; then
              echo "Diffing from $covered, the last successful run of this workflow"
              BEFORE="$covered"
            else
              echo "No successful ancestor baseline; running all packages"
            fi
          fi

          # Files changed by this PR, by this merge queue group (queued merge
          # commit vs the base it was built on), or by this push to master.
          # Schedule/dispatch runs (and pushes or groups we can't diff, e.g. a
          # new branch or a force-push past the old head) test everything.
          changed=""
          full=1
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            full=0
          elif [[ "${{ github.event_name }}" == "merge_group" && -n "$MERGE_GROUP_BASE" ]] \
              && git cat-file -e "${MERGE_GROUP_BASE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$MERGE_GROUP_BASE" HEAD)
            full=0
          elif [[ "${{ github.event_name }}" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            full=0
          fi

          if [[ "$full" == "0" ]]; then

            # If shared config changed, run all packages (can't tell which are affected)
            if echo "$changed" | grep -qE '^(Makefile|conftest\.py|pyproject\.toml|uv\.lock|\.github/workflows/test-packages\.yml)'; then
              echo "Shared config changed, running all packages"
              packages=$(cat /tmp/all_packages.json)
            else
              # Files directly under packages/ (not in a subdirectory) also trigger full run
              if echo "$changed" | grep -qE '^packages/[^/]+$'; then
                echo "Root-level packages/ file changed, running all packages"
                packages=$(cat /tmp/all_packages.json)
              else
                # Extract affected package names from changed paths (packages/<name>/...)
                affected=$(echo "$changed" | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u)

                if [ -z "$affected" ]; then
                  echo "No package files changed, skipping tests"
                  packages="[]"
                else
                  # Filter all packages to only affected ones
                  packages=$(echo "$affected" | python3 -c "import json,sys; all_pkgs=json.load(open('/tmp/all_packages.json')); affected=set(sys.stdin.read().strip().split('\n')); print(json.dumps([p for p in all_pkgs if p in affected]))")
                fi
              fi
            fi
          else
            packages=$(cat /tmp/all_packages.json)
          fi

          echo "packages=$packages" >> $GITHUB_OUTPUT
          echo "Discovered packages: $packages"

      # Bundle the packages into a few shards for the test matrix. A package's
      # tests take ~0.5 min, while each job pays its own runner provisioning,
      # checkout and uv/Python setup and holds one of the org's 20 shared
      # concurrent job slots, so one job per package mostly queued overhead.
      # Shards: min(5, ceil(n/8)); round-robin over the sorted list so a
      # package keeps its shard between runs. Timeout: ~1.5 min per package
      # plus setup, capped at 25.
      - name: Shard packages
        id: shard
        env:
          ITEMS: ${{ steps.discover.outputs.packages }}
        run: |
          python3 - <<'PY'
          import json, math, os
          items = sorted(json.loads(os.environ["ITEMS"]))
          count = min(5, math.ceil(len(items) / 8))
          shards = []
          for i in range(count):
              members = items[i::count]
              shards.append({
                  "id": i + 1,
                  "of": count,
                  "packages": " ".join(members),
                  "timeout": min(25, 10 + math.ceil(1.5 * len(members))),
              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"shards={json.dumps(shards)}\n")
          for shard in shards:
              print(f"shard {shard['id']}/{shard['of']}: {shard['packages']}")
          PY

  # Test the packages in a few shards (see "Shard packages" in discover)
  test:
    name: test (${{ matrix.python-version }}, shard ${{ matrix.shard.id }}/${{ matrix.shard.of }})
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # The shared lock requires >=3.11. Python 3.10 support must be
        # exercised in isolated package jobs (e.g. rag-lightweight), not
        # labelled as covered by an incompatible workspace installation.
        # PRs test the 3.11 floor only: it is where newer-syntax breaks show
        # up, and the second version doubled this workflow's PR jobs on the
        # shared runner pool, starving master runs. Push, schedule and
        # dispatch keep the full matrix, so 3.12-only breaks surface on
        # master or in the nightly run.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12"]') }}
        shard: ${{ fromJson(needs.discover.outputs.shards) }}
    env:
      CI_EXPECTED_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-packages --python "${{ steps.python.outputs.python-path }}"

      - name: Run tests for each package in the shard
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          SHARD_PACKAGES: ${{ matrix.shard.packages }}
        run: |
          # Same per-package command as the old one-job-per-package matrix.
          # test-package falls back to a generic pytest run for packages
          # without their own Makefile, so a package is never skipped for
          # lacking a Makefile. Every package runs even after a failure; the
          # step fails at the end and names the failed packages.
          failed=()
          summary=()
          for pkg in $SHARD_PACKAGES; do
            echo "::group::$pkg"
            start=$SECONDS
            if make test-package PKG="$pkg"; then
              result=pass
            else
              result=FAIL
              failed+=("$pkg")
            fi
            echo "::endgroup::"
            summary+=("$(printf '%-32s %-4s %4ss' "$pkg" "$result" "$((SECONDS - start))")")
          done
          echo "Shard summary:"
          printf '  %s\n' "${summary[@]}"
          {
            echo '```'
            printf '%s\n' "${summary[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Package tests failed: ${failed[*]}"
            exit 1
          fi

  # A workspace sync can mask missing dependencies with other members' installs.
  rag-lightweight:
    needs: changes
    # Installs only packages/gptme-rag and runs the lesson-match hook, so PRs
    # that touch neither skip it (same in the merge queue). Push, schedule and
    # dispatch always run it.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base package outside the workspace environment
        run: |
          uv venv /tmp/rag-lightweight --python "${{ matrix.python-version }}"
          uv pip install --python /tmp/rag-lightweight/bin/python ./packages/gptme-rag
          # The harness reads TOML config on Python 3.10; this is not an ML dependency.
          if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
            uv pip install --python /tmp/rag-lightweight/bin/python tomli
          fi
      - name: Verify minimal dependencies and real lesson emission
        run: /tmp/rag-lightweight/bin/python -I packages/gptme-rag/tests/smoke_lightweight_install.py

  # Coverage report (combined for all packages)
  coverage:
    needs: [changes, discover]
    # Push, schedule and dispatch cover every package. On PRs, cover only the
    # packages discover selected for the test matrix: Codecov's patch coverage
    # needs only the changed lines, and the full loop (~12 runner-minutes) was
    # most of this workflow's cost on a PR that touches one package. This job
    # cannot fail a PR (each package run ends in `|| true`), so it gates nothing.
    # !cancelled() keeps push runs independent of discover's result, as before.
    # Skipped in the merge queue: it gates nothing, and a Codecov upload for a
    # temporary gh-readonly-queue/* branch is noise.
    if: >-
      ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.discover.result == 'success' && needs.discover.outputs.packages != '[]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          # Retry apt-get update to handle transient repository errors
          for i in {1..3}; do
            if sudo apt-get update -o Acquire::http::Timeout=30; then
              break
            fi
            if [ $i -lt 3 ]; then
              echo "apt-get update failed, retrying in 5s..."
              sleep 5
            else
              # Continue anyway - system deps may not be critical if already installed
              echo "apt-get update failed after 3 attempts, continuing..."
            fi
          done
          sudo apt-get install -y portaudio19-dev libportaudio2

      - name: Install dependencies
        run: |
          uv sync --all-packages --all-extras

      - name: Run coverage for all packages
        env:
          # JSON array of package names on PRs; empty (cover everything) otherwise
          PR_PACKAGES: ${{ github.event_name == 'pull_request' && needs.discover.outputs.packages || '' }}
        run: |
          # Find all packages with tests and collect coverage
          for pkg in packages/*/; do
            pkg=${pkg%/}
            name=$(basename "$pkg")
            # Skip __pycache__ and symlinks
            [ -L "$pkg" ] && continue
            [ "$name" = "__pycache__" ] && continue
            if [ -n "$PR_PACKAGES" ] && ! PKG="$name" python3 -c 'import json,os,sys; sys.exit(os.environ["PKG"] not in json.loads(os.environ["PR_PACKAGES"]))'; then
              continue
            fi
            # Only packages with both tests/ and src/
            if [ -d "$pkg/tests" ] && [ -d "$pkg/src" ]; then
              echo "=== Coverage for $name ==="
              uv run --with pytest --with pytest-cov --with pytest-timeout pytest "$pkg/tests" \
                --cov="$pkg/src" \
                --cov-append \
                --cov-report=term-missing \
                -m "not slow" \
                --timeout=30 \
                -q || true
            fi
          done
          # Generate combined XML report once after all packages
          uv run --with coverage coverage xml || true

      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: packages
          name: codecov-packages
          fail_ci_if_error: false

  # Typecheck all packages (single job, not parallelized per-package)
  typecheck:
    needs: changes
    # Always run on push to master; on PRs and in the merge queue, only when
    # package code changed
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --all-packages

      - name: Run typecheck
        run: |
          make typecheck-packages
          make typecheck-scripts

      # Metric only (see `make typecheck-coverage`); the gate is the step above.
      # Default `success()` condition on purpose: a typecheck failure must not
      # publish a report from that commit, or the Codecov baseline for
      # subsequent PRs would move to a broken tree. `continue-on-error` keeps a
      # broken metric (e.g. a mypy crash that writes no report) a loud warning
      # instead of a red check on an unrelated PR.
      # Skipped in the merge queue (metric only; the queue branch is temporary).
      - name: Generate type coverage report
        if: github.event_name != 'merge_group'
        continue-on-error: true
        run: make typecheck-coverage

      - name: Upload type coverage to Codecov
        if: ${{ github.event_name != 'merge_group' && hashFiles('.mypy_coverage_report/cobertura.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .mypy_coverage_report/cobertura.xml
          flags: type-coverage
          name: codecov-type-coverage
          fail_ci_if_error: false

  # Check install sizes don't exceed budgets (prevents silent regressions like #1416)
  install-size:
    needs: changes
    # Always run on push to master; on PRs and in the merge queue, only when
    # package code changed
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run script tests
        run: |
          uv run --with pytest --with pyyaml pytest tests/test_check_install_size.py tests/test_ci_python_runtime.py tests/test_ci_test_shards.py -v

      - name: Run install-size check
        run: |
          python3 scripts/check_install_size.py --verbose

  # Stable required check for the merge queue / branch ruleset. Matrix job
  # names vary per PR, so they can't be required directly. Skipped jobs pass
  # (a PR touching no packages must be mergeable); failed or cancelled ones
  # fail. always(), not !cancelled(): a skipped required check counts as
  # passing, so this job must run (and fail) even when the run is cancelled.
  # coverage is left out on purpose: it is metric-only and never gates.
  required:
    name: Packages / required
    needs: [changes, discover, test, rag-lightweight, typecheck, install-size]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check needed jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Needed job results: $RESULTS"
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::A required Test Packages job failed or was cancelled"
            exit 1
          fi
