name: Pre-commit Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, 'feat/**' ]
  # Merge queue: test the queued merge commit before it lands on master.
  merge_group:
    types: [checks_requested]

# Cancel a PR's older runs when it gets a new push (they're superseded).
# Pushes to a branch share one group without cancel-in-progress: a running
# master run finishes, but a queued one is replaced by the newer push, so a
# burst of merges runs once on the latest commit instead of once per commit.
# Push runs here test the whole tree, so the survivor covers the replaced
# commits. Schedule/dispatch runs keep a per-commit group, and so do merge
# queue runs: github.sha is the merge group's head_sha, so a queue run never
# shares a group with (or is cancelled by) a PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    # Required check name for the merge queue / branch ruleset; keep it unique
    # across workflows.
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The file-size ratchet's growth budget compares against the merge
          # commit's first parent (the base branch tip), which depth 1 omits.
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install apt dependencies
        run: |
          sudo apt install shellcheck
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pre-commit
        run: |
          pipx install pre-commit
      - name: Verify remote Python hook installation
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          git -C "$consumer" init
          touch "$consumer/README.md"
          printf '%s\n' \
            'allowed_entries:' \
            '  - README.md' \
            '  - root-structure-allowlist.yaml' \
            > "$consumer/root-structure-allowlist.yaml"
          git -C "$consumer" add README.md root-structure-allowlist.yaml
          cd "$consumer"
          pre-commit try-repo "$GITHUB_WORKSPACE" \
            validate-root-structure --all-files
      - name: Create virtual environment
        # --locked fails if uv.lock is stale vs any pyproject.toml (e.g. a
        # version bump without `uv lock`), which otherwise dirties every
        # consumer's submodule on their next `uv sync`.
        run: |
          uv sync --all-packages --locked
      - name: Run pre-commit
        env:
          # Per-change growth for the file-size ratchet. On pull_request and
          # merge_group the checked-out commit's first parent is the base tip,
          # so the whole PR is measured. A push run compares to HEAD, i.e. it
          # checks only the new-file rule: the change already landed, and
          # failing master retroactively for growth helps nobody.
          FILE_SIZE_RATCHET_BASE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'HEAD^1' || '' }}
        run: pre-commit run --all-files
