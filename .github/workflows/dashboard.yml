name: Deploy Dashboard

on:
  schedule:
    # Monday 04:00 UTC — refresh community plugins even when the repo is quiet.
    # Replaces the old community-plugins.yml commit-and-PR job: the JSON is a
    # gitignored generated artifact (see #1449), so we fetch at build time.
    - cron: '0 4 * * 1'
  push:
    branches: [master]
    paths:
      - 'lessons/**'
      - 'plugins/**'
      - 'packages/**'
      - 'skills/**'
      - 'gptme.toml'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch community plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python3 scripts/fetch-community-plugins.py; then
            echo "Community plugin index written to docs/community_plugins.json"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled community-plugin fetch failed"
            exit 1
          else
            echo "Fetch failed; dashboard will omit the community section"
          fi

      - name: Install gptme-dashboard
        run: uv pip install --system -e packages/gptme-dashboard

      - name: Build dashboard
        run: gptme-dashboard --workspace . --output _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
