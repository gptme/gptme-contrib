[project]
name = "gptme-contrib-workspace"
version = "0.1.0"
description = "Community contributions and utilities for gptme agents"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
validate-root-structure = "validate_root_structure_yaml:main"

# The workspace root is installed when consumers use a remote Python
# pre-commit hook. Package only the hook module instead of auto-discovering the
# monorepo's many top-level directories.
[tool.setuptools]
py-modules = ["validate_root_structure_yaml"]
package-dir = { "" = "scripts/precommit/validators" }

[dependency-groups]
dev = [
    "flask>=3.0.0",
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]
exclude = ["packages/__pycache__", "plugins/__pycache__", "packages/tasks"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Pin numpy to pypi so index-strategy="unsafe-best-match" can't
# nondeterministically re-resolve it from the pytorch-cpu index, which
# caused recurring uv.lock source-registry churn (numpy flipping between
# pypi and download.pytorch.org). Same-version, same-hash flip — cosmetic
# but noisy across machines. See alice journal 2026-08-18.
numpy = { index = "pypi" }
gptme = { git = "https://github.com/gptme/gptme.git", branch = "master" }
gptme-sessions = { workspace = true }
gptme-usage = { workspace = true }
gptodo = { workspace = true }
gptmail = { workspace = true }

[tool.pytest.ini_options]
# Required for cross-package test collection (pytest packages/)
# Without this, multiple packages with tests/__init__.py cause namespace collisions
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
cache_dir = ".pytest_cache"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",    # line-too-long: 179 pre-existing violations, fix separately
    "UP006",   # non-pep585-annotation: bulk-fix separately
    "UP035",   # deprecated-import: bulk-fix separately
]
