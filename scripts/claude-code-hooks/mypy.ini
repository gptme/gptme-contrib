[mypy]
python_version = 3.12
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_optional = True

# Bob-only instrumentation is optional and is not part of this workspace.
# Unlike the root config (also used by isolated pre-commit environments), this
# CI gate must not suppress unresolved gptme or gptme_rag imports.
[mypy-context.*]
ignore_missing_imports = True
